<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SAV 3GCOM</title>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<style>
body{font-family:system-ui,sans-serif;background:#f5f5f5;margin:0;padding:10px}
#header{background:#111;color:#fff;padding:16px;border-radius:14px;text-align:center;margin-bottom:12px;font-weight:bold;font-size:20px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px #0001}
.big{font-size:20px;font-weight:900}
.btn{width:48%;padding:16px 0;border-radius:12px;border:0;font-size:17px;font-weight:bold;margin-top:10px}
.call{background:#e8f5e9;color:#2e7d32}.maps{background:#e3f2fd;color:#1565c0}
.done{background:#2e7d32;color:#fff;width:100%}.inj{background:#c62828;color:#fff;width:100%;margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.motif{padding:18px;border-radius:12px;background:#fff3e0;border:2px solid #ffe0b2;text-align:center;font-weight:bold;font-size:16px}
#debug{background:#fffbe6;padding:10px;border-radius:8px;font-size:12px;margin-bottom:10px;border:1px solid #ffe58f}
</style>
</head><body>
<div id="header">🔧 SAV - <span id="techName">...</span><br><small id="count"></small></div>
<div id="debug">Init...</div>
<div id="list">Chargement...</div>
<button onclick="testPushNow()" style="width:100%;padding:14px;background:#111;color:#fff;border-radius:12px;margin-top:20px;font-weight:bold">🔔 TEST PUSH NOW</button>
<script>
// === IMPORTANT: COPIEZ VOTRE WEB APP URL ICI ===
const EXEC_URL = "https://script.google.com/macros/s/AKfycby3B5fdlil_vHB09b7X-DMn6jrzJUI1gIo5zacN5M3qmvLsw0o5fGHeuSQKdvAuHeScGQ/exec"; // <-- Si vous avez une nouvelle URL, collez-la ici

const ONESIGNAL_APP_ID = "ba944959-097a-43c3-83c6-245d23f232d3";
const params = new URLSearchParams(location.search);
const TECH = (params.get('tech')||'nazih').toLowerCase();
document.getElementById('techName').innerText = TECH;

window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal){
  await OneSignal.init({appId: ONESIGNAL_APP_ID, allowLocalhostAsSecureOrigin: true});
  try{ await OneSignal.User.addTag("tech", TECH); document.getElementById('debug').innerText = "✅ Notif OK - tag: "+TECH; }catch(e){ document.getElementById('debug').innerText = "❌ OneSignal: "+e; }
});

function onJobs(jobs){
  document.getElementById('count').innerText = jobs.length + " jobs à faire";
  let html="";
  jobs.forEach(j=>{
    html+= `<div class="card"><div class="big">${j.id}</div><div>👤 ${j.client}</div><div>📍 ${j.adresse}</div><div>📞 ${j.tel}</div><div style="display:flex;justify-content:space-between"><button class="btn call" onclick="window.open('tel:${j.tel}')">📞 APPELER</button><button class="btn maps" onclick="window.open('https://maps.google.com/?q='+encodeURIComponent(j.adresse))">🗺️ MAPS</button></div><button class="btn done" onclick="showMotifs('${j.id}')">✅ FAIT</button><button class="btn inj" onclick="doUpdate('${j.id}','Injoignable','')">❌ INJOIGNABLE</button><div id="motifs-${j.id}" style="display:none" class="grid"><div class="motif" onclick="doUpdate('${j.id}','Fait','PCO')">PCO</div><div class="motif" onclick="doUpdate('${j.id}','Fait','PTO')">PTO</div><div class="motif" onclick="doUpdate('${j.id}','Fait','Splitter')">Splitter</div><div class="motif" onclick="doUpdate('${j.id}','Fait','Cable')">Câble</div><div class="motif" onclick="doUpdate('${j.id}','Fait','Jartiere')">Jartière</div><div class="motif" onclick="doUpdate('${j.id}','Fait','Config')">Config</div></div></div>`;
  });
  if(jobs.length==0) html="<div class='card'>Aucun job ✅ Ajoutez dans Sheet: Tech=nazih, Statut=A faire</div>";
  document.getElementById('list').innerHTML=html;
  document.getElementById('debug').innerText += " | Jobs: "+jobs.length;
}

function loadJobs(){
  document.getElementById('debug').innerText = "Chargement "+TECH+" depuis Sheet...";
  var s = document.createElement('script');
  s.src = EXEC_URL + "?action=getJobs&tech=" + encodeURIComponent(TECH) + "&callback=onJobs&t=" + Date.now();
  s.onerror = function(){
    document.getElementById('debug').innerHTML = "❌ EXEC_URL invalide ou Apps Script non déployé en <b>New version</b><br>URL actuelle: "+EXEC_URL+"<br>Copiez la bonne URL depuis Apps Script > Deploy > Manage deployments > Web app URL";
    document.getElementById('list').innerHTML="<div class='card' style='color:red'>❌ Impossible de joindre Sheet<br>1. Allez dans Apps Script<br>2. Collez Code.gs.FIXED.txt<br>3. Deploy > New version<br>4. Copiez Web app URL dans index.html</div>";
  };
  document.body.appendChild(s);
}

function showMotifs(id){var e=document.getElementById('motifs-'+id); e.style.display=e.style.display=='none'?'grid':'none';}
function doUpdate(id,statut,motif){
  if(!confirm(statut+" "+motif+" ?")) return;
  document.getElementById('list').innerHTML="Enregistrement...";
  var s=document.createElement('script');
  s.src=EXEC_URL+"?action=updateJob&id="+encodeURIComponent(id)+"&statut="+encodeURIComponent(statut)+"&motif="+encodeURIComponent(motif)+"&callback=onUpdateDone&t="+Date.now();
  document.body.appendChild(s);
}
function onUpdateDone(){ setTimeout(loadJobs, 1200); }
function testPushNow(){
  var s=document.createElement('script');
  s.src=EXEC_URL+"?action=pushTest&tech="+encodeURIComponent(TECH)+"&callback=onPushTest&t="+Date.now();
  document.body.appendChild(s);
}
function onPushTest(r){ alert("Push: "+JSON.stringify(r)); }
loadJobs();
setInterval(loadJobs, 30000);
</script>
</body></html>
